modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/CappleApple/panelsnotscreens/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/CappleApple/panelsnotscreens"
authors="CappleApple"
logoFile="assets/panelsnotscreens/textures/gui/panels-not-screens-logo.png"
logoBlur=false
description='''
A reusable client-side framework for draggable and dockable panels layered over Minecraft screens.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
